<html lang="en">

<title>Kulgam Eats</title>

<style>
/* Kulgam Eats prototype. Dark, glowing UI: neon gradients on a near-black base. */
@font-face { font-family: "PJS"; src: url(data:font/woff2;base64,__PJS600__) format("woff2"); font-weight: 600; }
@font-face { font-family: "PJS"; src: url(data:font/woff2;base64,__PJS800__) format("woff2"); font-weight: 800; }
:root {
  --bg: #07080d; --bg-2: #0d0f17; --card: #12141e; --card-2: #181b28; --line: rgb(255 255 255 / .08); --line-2: rgb(255 255 255 / .14);
  --ink: #f5f6fb; --ink-2: #b7bccb; --ink-3: #7c8296;
  --hot: #ff5a36; --pink: #ff2e83; --violet: #8b5cff; --lime: #3ef2a0; --amber: #ffb547; --red: #ff4d5e;
  --grad: linear-gradient(120deg, #ff6a3d 0%, #ff2e83 55%, #a24bff 100%);
  --glow: 0 0 0 1px rgb(255 90 54 / .35), 0 8px 30px -6px rgb(255 46 131 / .55), 0 0 60px -10px rgb(255 90 54 / .45);
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --font: "PJS", system-ui, -apple-system, Roboto, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #030306; color: var(--ink); font-family: var(--font); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 16px; height: 16px; } .ico.lg { width: 26px; height: 26px; }

/* Phone frame on desktop, full screen on phones */
.stage { min-height: 100%; display: grid; place-items: center; padding: 24px; background: radial-gradient(800px 500px at 20% 10%, #241018, transparent), radial-gradient(700px 500px at 90% 90%, #140f2a, transparent), #030306; }
.phone { width: 390px; height: 844px; border-radius: 46px; position: relative; overflow: hidden; background: var(--bg); box-shadow: 0 0 0 10px #15161c, 0 0 0 11px #2a2c35, 0 40px 120px -20px rgb(255 46 131 / .25); }
@media (max-width: 520px) { .stage { padding: 0; display: block; } .phone { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; } }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.screen::before { content: ""; position: absolute; inset: -20% -30% auto; height: 420px; background: radial-gradient(closest-side, rgb(255 70 60 / .22), transparent), radial-gradient(closest-side at 80% 40%, rgb(139 92 255 / .18), transparent); pointer-events: none; filter: blur(10px); }
.scroll { flex: 1; overflow-y: auto; scrollbar-width: none; position: relative; }
.scroll::-webkit-scrollbar { display: none; }
.enter { animation: enter .35s cubic-bezier(.2,.8,.2,1); } @keyframes enter { from { opacity: 0; transform: translateY(14px) scale(.985); } }
.pad { padding: 0 18px; }
.top { padding: calc(var(--sat) + 16px) 18px 10px; position: relative; z-index: 2; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.muted { color: var(--ink-3); } .small { font-size: 12.5px; }
.gradtext { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* Header */
.loc { display: flex; align-items: center; gap: 8px; text-align: left; }
.loc .pin { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: rgb(255 90 54 / .14); color: var(--hot); box-shadow: inset 0 0 0 1px rgb(255 90 54 / .3); }
.loc b { display: block; font-size: 16px; font-weight: 800; } .loc span { font-size: 12px; color: var(--ink-3); }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; font-weight: 800; box-shadow: var(--glow); }
.search { margin-top: 16px; height: 50px; border-radius: 16px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-3); font-size: 15px; width: 100%; text-align: left; }
.search .ico { color: var(--hot); }
h2 { font-size: 19px; font-weight: 800; margin: 26px 0 12px; letter-spacing: -.02em; }
h2 small { display: block; font-size: 12.5px; color: var(--ink-3); font-weight: 600; letter-spacing: 0; margin-top: 2px; }

/* Hero offer */
.hero { margin-top: 18px; border-radius: 24px; padding: 18px; position: relative; overflow: hidden; background: linear-gradient(135deg, #2a0f14, #1a0c26); box-shadow: inset 0 0 0 1px rgb(255 90 54 / .25), 0 20px 50px -20px rgb(255 46 131 / .5); }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(closest-side, rgb(255 90 54 / .55), transparent); filter: blur(4px); animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.15); opacity: .7; } }
.hero b { font-size: 22px; font-weight: 800; letter-spacing: -.02em; display: block; position: relative; z-index: 1; }
.hero p { margin: 6px 0 0; color: var(--ink-2); font-size: 13.5px; position: relative; z-index: 1; max-width: 250px; line-height: 1.45; }
.hero .tag { display: inline-flex; gap: 6px; align-items: center; margin-top: 12px; padding: 6px 10px; border-radius: 99px; background: rgb(62 242 160 / .12); color: var(--lime); font-size: 12px; font-weight: 800; position: relative; z-index: 1; }

/* Cuisine chips */
.cuis { display: flex; gap: 12px; overflow-x: auto; padding: 4px 18px 6px; margin: 0 -18px; scrollbar-width: none; }
.cuis::-webkit-scrollbar { display: none; }
.cu { flex: none; display: grid; justify-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.cu i { width: 62px; height: 62px; border-radius: 20px; display: grid; place-items: center; background: var(--card); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink); transition: box-shadow .2s, transform .2s; }
.cu[aria-pressed="true"] { color: var(--ink); } .cu[aria-pressed="true"] i { background: linear-gradient(160deg, rgb(255 90 54 / .25), rgb(255 46 131 / .15)); box-shadow: inset 0 0 0 1.5px var(--hot), 0 0 24px -4px rgb(255 90 54 / .7); color: #fff; }

/* Restaurant cards */
.rcard { display: block; width: 100%; text-align: left; margin-bottom: 16px; border-radius: 24px; overflow: hidden; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); position: relative; transition: transform .15s; }
.rcard:active { transform: scale(.985); }
.rcard .img { height: 150px; background-size: cover; background-position: center; position: relative; }
.rcard .img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgb(7 8 13 / .9)); }
.rcard .img .ph { position: absolute; inset: 0; display: grid; place-items: center; color: rgb(255 255 255 / .9); }
.rcard .img .ph .ico { width: 54px; height: 54px; stroke-width: 1.4; filter: drop-shadow(0 0 18px rgb(255 255 255 / .5)); }
.rcard .badges { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; z-index: 1; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 99px; font-size: 11.5px; font-weight: 800; background: rgb(7 8 13 / .65); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: inset 0 0 0 1px var(--line-2); }
.pill.hot { background: var(--grad); box-shadow: 0 0 18px -2px rgb(255 46 131 / .7); }
.pill.lime { color: var(--lime); } .pill.red { color: var(--red); }
.rcard .eta { position: absolute; right: 12px; bottom: 12px; z-index: 1; }
.rcard .bd { padding: 12px 16px 16px; }
.rcard .nm { font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
.rcard .meta { margin-top: 4px; color: var(--ink-3); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-3); }
.rcard .fee { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line-2); font-size: 12.5px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
.rcard .fee .ico { color: var(--hot); }
.rcard.off { opacity: .55; }
.rcard.glow { box-shadow: inset 0 0 0 1px rgb(255 90 54 / .35), 0 18px 40px -18px rgb(255 46 131 / .55); }

/* Bottom nav */
.nav { position: relative; z-index: 5; display: grid; grid-template-columns: repeat(3, 1fr); padding: 8px 10px calc(var(--sab) + 10px); background: rgb(7 8 13 / .85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
.nav button { display: grid; justify-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--ink-3); padding: 6px 0; }
.nav button[aria-current="true"] { color: #fff; } .nav button[aria-current="true"] .ico { color: var(--hot); filter: drop-shadow(0 0 8px rgb(255 90 54 / .9)); }

/* Restaurant page */
.rhead { height: 230px; background-size: cover; background-position: center; position: relative; flex: none; }
.rhead::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgb(7 8 13 / .5), transparent 30%, rgb(7 8 13 / .2) 60%, var(--bg)); }
.back { position: absolute; z-index: 700; top: calc(var(--sat) + 14px); left: 14px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgb(7 8 13 / .6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: inset 0 0 0 1px var(--line-2); }
.rinfo { margin: -60px 16px 0; position: relative; z-index: 2; padding: 16px; border-radius: 24px; background: rgb(18 20 30 / .88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 0 0 1px var(--line-2), 0 20px 50px -20px #000; }
.rinfo h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.025em; }
.rinfo .meta { color: var(--ink-3); font-size: 13px; margin-top: 4px; }
.rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.rules div { padding: 10px; border-radius: 14px; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line); }
.rules b { display: block; font-size: 14px; } .rules span { font-size: 11px; color: var(--ink-3); }
.own { margin-top: 12px; display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--lime); }
.sample { margin: 14px 16px 0; padding: 10px 12px; border-radius: 14px; background: rgb(255 181 71 / .1); color: var(--amber); font-size: 12px; line-height: 1.45; box-shadow: inset 0 0 0 1px rgb(255 181 71 / .25); }
.msec { padding: 0 16px; }
.msec h3 { font-size: 17px; font-weight: 800; margin: 24px 0 6px; }
.item { display: grid; grid-template-columns: 1fr 108px; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.veg { width: 14px; height: 14px; border-radius: 3px; display: inline-grid; place-items: center; border: 1.5px solid var(--lime); margin-right: 6px; vertical-align: -2px; }
.veg::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--lime); }
.veg.nv { border-color: var(--red); } .veg.nv::after { background: var(--red); border-radius: 0; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 7px solid var(--red); background: none; }
.item b { font-size: 15.5px; font-weight: 800; } .item .p { margin-top: 4px; font-weight: 800; }
.item .d { margin-top: 6px; font-size: 12.5px; color: var(--ink-3); line-height: 1.4; }
.item .pic { height: 96px; border-radius: 16px; background: var(--card-2); position: relative; display: grid; place-items: center; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); }
.add { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); min-width: 88px; height: 36px; border-radius: 12px; background: #fff; color: #e5352c; font-weight: 800; font-size: 14px; box-shadow: 0 6px 18px -4px rgb(255 90 54 / .6); display: flex; align-items: center; justify-content: center; gap: 0; }
.add.on { background: var(--grad); color: #fff; justify-content: space-between; padding: 0 4px; box-shadow: 0 0 22px -2px rgb(255 46 131 / .8); }
.add.on button { width: 28px; height: 28px; display: grid; place-items: center; font-size: 18px; font-weight: 800; }

/* Sticky cart bar */
.cartbar { position: absolute; left: 14px; right: 14px; bottom: calc(var(--sab) + 14px); z-index: 6; height: 62px; border-radius: 20px; background: var(--grad); display: flex; align-items: center; justify-content: space-between; padding: 0 18px; box-shadow: 0 0 40px -6px rgb(255 46 131 / .8), 0 14px 30px -10px #000; overflow: hidden; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
.cartbar::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgb(255 255 255 / .35) 50%, transparent 70%); transform: translateX(-100%); animation: shine 2.6s ease-in-out infinite; }
@keyframes shine { 60%, 100% { transform: translateX(100%); } }
@keyframes pop { from { transform: translateY(30px) scale(.9); opacity: 0; } }
.cartbar b { font-size: 15px; } .cartbar span { font-size: 12px; opacity: .9; display: block; }

/* Buttons */
.cta { width: 100%; height: 56px; border-radius: 18px; background: var(--grad); font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 0 34px -6px rgb(255 46 131 / .8); position: relative; overflow: hidden; }
.cta::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgb(255 255 255 / .3) 50%, transparent 70%); transform: translateX(-100%); animation: shine 2.8s ease-in-out infinite; }
.cta:disabled { background: var(--card-2); color: var(--ink-3); box-shadow: none; } .cta:disabled::after { display: none; }
.ghost { width: 100%; height: 50px; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line-2); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
.ghost.red { color: var(--red); }
.foot { padding: 12px 16px calc(var(--sab) + 14px); background: linear-gradient(transparent, var(--bg) 30%); position: relative; z-index: 5; }

/* Cards & lists */
.card { margin: 0 16px 14px; padding: 16px; border-radius: 22px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.card h4 { margin: 0 0 12px; font-size: 14px; color: var(--ink-2); font-weight: 800; }
.line { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; font-size: 14px; color: var(--ink-2); }
.line b { color: var(--ink); } .line.total { border-top: 1px dashed var(--line-2); margin-top: 6px; padding-top: 12px; font-size: 16px; color: var(--ink); font-weight: 800; }
.line small { display: block; color: var(--ink-3); font-size: 11.5px; }
.ci { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 8px 0; }
.qty { height: 32px; border-radius: 10px; display: flex; align-items: center; gap: 2px; box-shadow: inset 0 0 0 1px var(--hot); color: var(--hot); font-weight: 800; }
.qty button { width: 28px; height: 32px; font-size: 17px; font-weight: 800; color: var(--hot); }
.paym { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 40px 1fr 22px; gap: 12px; align-items: center; padding: 14px; border-radius: 18px; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line); text-align: left; }
.opt i { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgb(255 255 255 / .06); }
.opt b { font-size: 15px; } .opt span { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.opt .radio { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line-2); }
.opt[aria-checked="true"] { box-shadow: inset 0 0 0 1.5px var(--hot), 0 0 26px -8px rgb(255 90 54 / .8); }
.opt[aria-checked="true"] .radio { box-shadow: inset 0 0 0 6px var(--hot); }
.opt[aria-disabled="true"] { opacity: .45; }
.addr { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; }
.addr i { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgb(255 90 54 / .14); color: var(--hot); }
.warn { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgb(255 181 71 / .1); color: var(--amber); font-size: 12.5px; display: flex; gap: 8px; align-items: center; }
.mini { font-size: 12px; color: var(--ink-3); line-height: 1.5; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.seg button { height: 34px; padding: 0 12px; border-radius: 99px; font-size: 12.5px; font-weight: 700; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: rgb(255 90 54 / .16); box-shadow: inset 0 0 0 1.5px var(--hot); color: #fff; }

/* Waiting / radar */
.center { flex: 1; display: grid; place-items: center; text-align: center; padding: 0 28px; position: relative; z-index: 1; }
.radar { width: 220px; height: 220px; position: relative; margin: 0 auto 28px; display: grid; place-items: center; }
.radar i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgb(255 90 54 / .6); animation: ring 2.4s ease-out infinite; }
.radar i:nth-child(2) { animation-delay: .8s; } .radar i:nth-child(3) { animation-delay: 1.6s; }
@keyframes ring { from { transform: scale(.35); opacity: 1; } to { transform: scale(1.1); opacity: 0; } }
.radar .core { width: 96px; height: 96px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; box-shadow: 0 0 60px rgb(255 46 131 / .8); position: relative; }
.radar .core::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; background: conic-gradient(from 0deg, transparent, rgb(255 255 255 / .8), transparent 30%); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 0); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 0); animation: spin 1.4s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }
.radar .core .ico { width: 40px; height: 40px; }
.center h1 { font-size: 24px; margin: 0 0 8px; letter-spacing: -.02em; }
.center p { color: var(--ink-2); margin: 0; line-height: 1.5; font-size: 14px; }
.timer { font-variant-numeric: tabular-nums; font-weight: 800; }
.tbar { height: 6px; border-radius: 99px; background: var(--card-2); overflow: hidden; margin: 18px auto 0; width: 220px; }
.tbar i { display: block; height: 100%; background: var(--grad); box-shadow: 0 0 14px rgb(255 46 131 / .9); transition: width 1s linear; }

/* Payment */
.payamt { text-align: center; padding: 6px 16px 16px; position: relative; z-index: 1; }
.payamt span { font-size: 13px; color: var(--ink-3); } .payamt b { display: block; font-size: 44px; font-weight: 800; letter-spacing: -.03em; margin-top: 2px; }
.qrwrap { width: 236px; height: 236px; margin: 0 auto; border-radius: 28px; padding: 14px; background: #fff; position: relative; box-shadow: 0 0 0 2px rgb(255 90 54 / .7), 0 0 50px -4px rgb(255 46 131 / .8); animation: qrglow 2.6s ease-in-out infinite; }
@keyframes qrglow { 50% { box-shadow: 0 0 0 2px rgb(139 92 255 / .8), 0 0 70px -2px rgb(139 92 255 / .7); } }
.qrwrap img, .qrwrap svg { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.qrwrap .scan { position: absolute; left: 14px; right: 14px; height: 3px; top: 14px; background: linear-gradient(90deg, transparent, var(--hot), transparent); box-shadow: 0 0 14px var(--hot); animation: scan 2.4s ease-in-out infinite; border-radius: 2px; }
@keyframes scan { 50% { top: calc(100% - 17px); } }
.upiid { display: flex; justify-content: center; gap: 8px; align-items: center; margin-top: 14px; font-size: 13.5px; color: var(--ink-2); }
.upiid code { font-family: inherit; font-weight: 800; color: #fff; }
.apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.apps button { height: 64px; border-radius: 16px; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line-2); display: grid; place-items: center; align-content: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--ink-2); }
.apps .lg { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 12px; color: #fff; }
.steps { display: grid; gap: 12px; }
.steps div { display: grid; grid-template-columns: 28px 1fr; gap: 10px; font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
.steps i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 13px; background: rgb(255 90 54 / .16); color: var(--hot); }
.utr { width: 100%; height: 50px; border-radius: 14px; border: 0; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line-2); color: #fff; font: inherit; font-size: 16px; padding: 0 14px; letter-spacing: .08em; outline: none; margin-top: 10px; }
.utr:focus { box-shadow: inset 0 0 0 1.5px var(--hot), 0 0 20px -6px rgb(255 90 54 / .8); }
.safe { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
.safe .ico { color: var(--lime); margin-top: 1px; }
.countdown { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 99px; background: rgb(255 77 94 / .12); color: #ff8a95; font-weight: 800; font-size: 13px; }

/* Tracking */
.map { height: 340px; position: relative; flex: none; }
.map .leaflet-container { position: absolute; inset: 0; background: #0b0c12; }
.map::after { content: ""; position: absolute; inset: auto 0 0; height: 90px; background: linear-gradient(transparent, var(--bg)); z-index: 500; pointer-events: none; }

.route { filter: drop-shadow(0 0 6px #ff2e83) drop-shadow(0 0 14px #ff5a36); }

const PLACES = [["Kulgam town", 33.6431, 75.0172], ["Qaimoh", 33.6465, 75.0205], ["Devsar", 33.6218, 75.0805], ["Qazigund", 33.5915, 75.1655]];

const RULES = { baseKm: 2, baseFee: 30, perKm: 10, maxKm: 6, minOrder: 150, freeAbove: 0, packing: 10, cod: true, acceptMin: 3, payMin: 10, cancelMin: 2 };

/* ---------- state ---------- */
const S = { view: "home", tab: "home", cuisine: "all", place: 0, rest: null, cart: {}, pay: "upi", order: null, mode: "customer", rules: { ...RULES } };

/* ---------- our own map and routing (OpenStreetMap roads, no API key, works offline) ---------- */
const BASE = __BASEMAP__;
let G = null;
function graph() {
  if (G) return G;
  const id = new Map(), xy = [], adj = [];
  const node = ([x, y]) => { const k = x + "," + y; let i = id.get(k); if (i === undefined) { i = xy.length; id.set(k, i); xy.push([y, x]); adj.push([]); } return i; };

  const { xy, adj } = graph(), dist = new Float64Array(xy.length).fill(Infinity), prev = new Int32Array(xy.length).fill(-1), h = [[0, src]]; dist[src] = 0;

function tracking() {

      <span class="pill hot">${o.id}</span></div>
      <div class="prog">${steps.map((s, i) => `<i class="${i < idx ? "done" : i === idx ? "now" : ""}"></i>`).join("")}</div></div>

    <div class="card"><div class="tl">${steps.map((s, i) => `<div class="${i < idx ? "done" : i === idx ? "now" : ""}"><b>${i < idx ? I("check", "sm") : i + 1}</b><span>${s[1]}</span><small>${i <= idx ? new Date(o.placed + i * 60000).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" }) : ""}</small></div>`).join("")}</div></div>
    <div class="card"><h4>${o.rest.name} · ${o.lines.length} item${o.lines.length > 1 ? "s" : ""}</h4>${o.lines.map(l => `<div class="line"><span>${l.qty} × ${l.name}</span><b>${rs(l.price * l.qty)}</b></div>`).join("")}
      <div class="line total"><span>${o.pay === "upi" ? "Paid by UPI" : "Pay cash on delivery"}</span><span>${rs(o.total)}</span></div></div>
    ${canCancel ? `<div class="card"><button class="ghost red" data-act="cancel-paid">Cancel order · <span class="timer" id="ct"></span> left</button><p class="mini" style="margin:8px 0 0">${o.pay === "upi" ? "The restaurant refunds your UPI payment within 24 hours. We track it." : "Free cancellation for the first few minutes."}</p></div>` : ""}
    <div style="height:20px"></div></div>
  ${st !== "out" ? `<button class="demo" data-act="${st === "paid" ? "cook" : "dispatch"}">Demo: ${st === "paid" ? "start cooking" : "rider leaves"}</button>` : ""}`;
}
after.tracking = () => {
  const o = S.order, h = me();
  const map = L.map("map", { zoomControl: false, attributionControl: false, preferCanvas: true }).setView([(o.rest.lat + h.lat) / 2, (o.rest.lon + h.lon) / 2], 15);
  L.control.attribution({ position: "topright", prefix: false }).addAttribution("© OpenStreetMap contributors").addTo(map);
  drawBase(map);
  // The rider follows the real road route here. In the real app this is the rider phone's live GPS.
  const path = roadPath(o.rest);
  L.polyline(path, { color: "#ff2e83", weight: 9, opacity: .25, className: "route" }).addTo(map);
  L.polyline(path, { color: "#ff6a8f", weight: 4, opacity: 1 }).addTo(map);
  const ic = (cls, ico) => L.divIcon({ className: "", html: `<div class="mk ${cls}">${I(ico, "sm")}</div>`, iconSize: [42, 42], iconAnchor: [21, 21] });
  L.marker(path[0], { icon: ic("rest", "store") }).addTo(map); L.marker(path[path.length - 1], { icon: ic("home", "house") }).addTo(map);
  map.fitBounds(path, { padding: [50, 60] });
  if (o.status === "out") {
    const rider = L.marker(path[0], { icon: ic("rider", "bike"), zIndexOffset: 1000 }).addTo(map);
    // move at constant speed along the route
    const cum = [0]; for (let i = 1; i < path.length; i++) cum.push(cum[i - 1] + KM(path[i - 1][0], path[i - 1][1], path[i][0], path[i][1]));
    const len = cum[cum.length - 1] || 1; let t = 0; const total = 400;
    timers.push(setInterval(() => { t++; const f = Math.min(1, t / total), dd = f * len; let i = cum.findIndex(c => c >= dd); if (i < 1) i = 1;
      const a = path[i - 1], b = path[i], lf = (dd - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1); rider.setLatLng([a[0] + (b[0] - a[0]) * lf, a[1] + (b[1] - a[1]) * lf]);
      const e = document.getElementById("eta"); if (e) e.textContent = Math.max(1, Math.round((1 - f) * Math.max(3, o.km * 4))) + " min";
      if (f >= 1) go("delivered"); }, 60));
  }
  if (o.cancelUntil) { const tick = () => { const left = Math.max(0, o.cancelUntil - Date.now()), el = document.getElementById("ct"); if (el) el.textContent = fmt(left / 1000); if (!left && el) render(); }; tick(); timers.push(setInterval(tick, 1000)); }
};

/* ---------- helpers ---------- */
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function countdown(secs, sel, barSel, onEnd) {
  const end = Date.now() + secs * 1000;
  const tick = () => { const left = Math.max(0, (end - Date.now()) / 1000); const el = document.querySelector(sel); if (el) el.textContent = fmt(left);
    const b = barSel && document.querySelector(barSel); if (b) b.style.width = (left / secs * 100) + "%"; if (!left) { clearTimers(); onEnd(); } };
  tick(); timers.push(setInterval(tick, 1000));
}
function rulesSheet(html) { const d = document.createElement("div"); d.innerHTML = `<div class="sheetdim"></div><div class="sheet">${html}<button class="cta" style="margin-top:16px" data-close>Got it</button></div>`; app.appendChild(d); d.addEventListener("click", e => { if (e.target.closest("[data-close]") || e.target.classList.contains("sheetdim")) d.remove(); }); }

app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if (d.nav) { if (d.nav === "owner") return go("owner"); if (d.nav === "orders") return S.order && !["cancelled"].includes(S.view) ? go(S.order.status === "placed" ? "waiting" : S.order.status === "accepted" ? "payment" : S.order.status === "verifying" ? "verifying" : "tracking", { tab: "orders" }) : toast("No orders yet"); return go("home", { tab: "home" }); }
  if (d.cuisine) return go("home", { cuisine: d.cuisine });
  if (d.rest) { const r = R.find(x => x.id === d.rest); if (S.rest?.id !== r.id) S.cart = {}; return go("restaurant", { rest: r }); }
  if (d.inc) { S.cart[d.inc] = (S.cart[d.inc] || 0) + 1; const sc = app.querySelector(".scroll")?.scrollTop; clearTimers(); render(); app.querySelector(".scroll").scrollTop = sc; return; }
  if (d.dec) { S.cart[d.dec]--; if (!S.cart[d.dec]) delete S.cart[d.dec]; if (!cartCount() && S.view === "cart") return go("restaurant"); const sc = app.querySelector(".scroll")?.scrollTop; render(); app.querySelector(".scroll").scrollTop = sc; return; }
  if (d.pay) { if (b.getAttribute("aria-disabled") === "true") return; S.pay = d.pay; return render(); }
  if (d.rule !== undefined) return;
  const a = d.act; const o = S.order;
  if (a === "home") return go("home", { tab: "home" });
  if (a === "restaurant") return go("restaurant");
  if (a === "cart") return go("cart");
  if (a === "place") return rulesSheet(`<h3>Deliver to</h3><div class="seg">${PLACES.map((p, i) => `<button data-pick="${i}" aria-pressed="${S.place === i}">${p[0]}</button>`).join("")}</div><p class="mini" style="margin-top:12px">In the real app you drop a pin on the map and add a landmark, since most homes here have no house number.</p>`);
  if (d.pick !== undefined) { S.place = +d.pick; app.querySelector(".sheetdim")?.parentElement.remove(); return render(); }
  if (a === "place-order") { S.order = newOrder(); return go("waiting"); }
  if (a === "accept") { o.status = "accepted"; o.accepted = Date.now(); if (o.pay === "cod") { o.status = "paid"; o.cancelUntil = Date.now() + S.rules.cancelMin * 60000; toast("Restaurant accepted · cash on delivery"); return go(S.view === "owner" ? "owner" : "tracking"); } return go(S.view === "owner" ? "owner" : "payment"); }
  if (a === "cancel") { const free = !o || ["placed", "accepted"].includes(o.status); S.order = null; S.cart = {}; return go("cancelled", { reason: free ? "Cancelled before payment. Nothing was charged." : "" }); }
  if (a === "copy") { navigator.clipboard?.writeText("demo.restaurant@upi").catch(() => {}); return toast("UPI ID copied"); }
  if (a === "upi-intent") return toast(/Android/i.test(navigator.userAgent) ? (location.href = S.upiLink, "Opening your UPI app…") : "On a phone this opens GPay / PhonePe with the amount filled in");
  if (a === "paid") { const u = (document.getElementById("utr").value || "").replace(/\D/g, ""); if (u && u.length < 4) return toast("Enter at least the last 4 digits"); o.utr = u; o.status = "verifying"; return go("verifying"); }
  if (a === "confirm") { o.status = "paid"; o.cancelUntil = Date.now() + S.rules.cancelMin * 60000; toast("Payment confirmed by the restaurant"); return go(S.view === "owner" ? "owner" : "tracking"); }
  if (a === "notpaid") { o.status = "accepted"; toast("Customer is told the payment wasn't found"); return go("owner"); }
  if (a === "cook") { o.status = "cooking"; o.cancelUntil = 0; return go(S.view === "owner" ? "owner" : "tracking"); }
  if (a === "dispatch") { o.status = "out"; return go(S.view === "owner" ? "owner" : "tracking"); }
  if (a === "mark-delivered") { toast("Delivered · ₹" + o.total + " added to today's sales"); S.order = null; return go("owner"); }
  if (a === "cancel-paid") { S.order = null; S.cart = {}; return go("cancelled", { reason: o.pay === "upi" ? `Cancelled within the free window. ${o.rest.name} refunds ${rs(o.total)} to your UPI within 24 hours. You'll see it under Orders.` : "Cancelled within the free window." }); }
  if (a === "help") return rulesSheet(`<h3>Payment not confirmed?</h3><ol><li>Keep your UPI app's receipt.</li><li>We call ${o.rest.name} for you.</li><li>If the money reached them, they confirm and cook. If not, you can pay again or cancel.</li></ol>`);
  if (a === "call") return toast("Calls the rider's phone");
  if (a === "rate") return toast("Thanks for rating!");
  if (a === "owner-settings") return go("ownerSettings");
  if (a === "cod") { S.rules.cod = !S.rules.cod; return render(); }
});
app.addEventListener("input", e => { const k = e.target.dataset.rule; if (!k) return; S.rules[k] = Math.max(0, Number(e.target.value) || 0);
  const ex = document.getElementById("ex"); if (ex) ex.textContent = [1.2, 3.4, 5.6].map(km => { const v = fee(km); return `${km} km → ${v === null ? "not delivered" : rs(v)}`; }).join(" · "); });
render();
</script>
